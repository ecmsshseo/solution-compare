<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>솔루션 비교 허브</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<link rel="stylesheet" href="style.css">
<style>
body{margin:0;padding:0;display:flex;}
#sidebar{flex-shrink:0;}
#shell-main{flex:1;display:flex;flex-direction:column;margin-left:var(--sw);min-height:100vh;}
#shell-topbar{height:46px;min-height:46px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 18px;gap:8px;position:sticky;top:0;z-index:50;box-shadow:0 1px 3px rgba(0,0,0,.05);}
#main-frame{flex:1;border:none;width:100%;min-height:calc(100vh - 46px);background:var(--bg);}
.shell-search{max-width:360px;flex-shrink:0;display:flex;align-items:center;gap:6px;background:var(--bg);border:1.5px solid var(--border);border-radius:8px;padding:5px 12px;}
.shell-search input{border:none;background:none;outline:none;font-size:13px;font-family:inherit;width:240px;color:var(--tx1);}
</style>
</head>
<body>
<nav id="sidebar">
  <div class="sb-logo"><div class="ico">📊</div><div><div class="txt">솔루션 비교 허브</div><div class="sub">SIIC 부천센터</div></div></div>
  <div class="sb-user" style="margin:10px 10px 0;">
    <div class="uname" id="sb-username">로그인 중...</div>
    <div class="urole" id="sb-userrole"></div>
  </div>
  <div class="sb-sec">
    <div class="sb-sec-lbl">메뉴</div>
    <div class="sb-item active" data-page="index"    onclick="navTo('index')"   ><span class="ni">🏠</span> 대시보드</div>
    <div class="sb-item"        data-page="trend"    onclick="navTo('trend')"   ><span class="ni">📰</span> 솔루션 동향</div>
    <div class="sb-item"        data-page="compare"  onclick="navTo('compare')" ><span class="ni">⚖️</span> 기능 비교표</div>
    <div class="sb-item"        data-page="search"   onclick="navTo('search')"  ><span class="ni">🔍</span> 기능 검색</div>
    <div class="sb-item edit-only" data-page="edit"  onclick="navTo('edit')"   ><span class="ni">✏️</span> 등록·수정</div>
    <div class="sb-item"        data-page="assignee" onclick="navTo('assignee')"><span class="ni">👤</span> 나의 현황</div>
    <div class="sb-item"        data-page="admin" id="admin-menu-item" style="opacity:0;pointer-events:none;" onclick="navTo('admin')"><span class="ni">🛡️</span> 관리자 메뉴</div>
  </div>
</nav>

<div id="shell-main">
  <div id="shell-topbar">
    <div class="tb-title" id="shell-title">대시보드</div>
    <div style="flex:1;"></div>
    <div class="shell-search">
      <span style="color:var(--tx3);">🔍</span>
      <input id="shell-search-input" placeholder="기능 검색..." onkeydown="if(event.key==='Enter'&&this.value)navToSearch(this.value)">
    </div>
    <button class="btn btn-o btn-sm" onclick="frameLogout()" style="flex-shrink:0;margin-left:6px;">로그아웃</button>
  </div>
  <iframe id="main-frame" src="dashboard.html"></iframe>
</div>

<!-- 로그인 화면 -->
<div id="shell-login" style="position:fixed;inset:0;background:linear-gradient(135deg,#0a1628 0%,#0d2247 50%,#0a1628 100%);display:none;align-items:center;justify-content:center;z-index:9999;">
  <div style="background:#fff;border-radius:16px;padding:40px 36px;width:340px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3);">
    <div style="font-size:36px;margin-bottom:8px;">📊</div>
    <div style="font-size:18px;font-weight:800;color:#0F172A;margin-bottom:4px;">솔루션 비교 허브</div>
    <div style="font-size:12px;color:#94A3B8;margin-bottom:28px;">SIIC 부천센터 · 커머스 코칭팀</div>
    <button id="shell-login-btn" style="width:100%;padding:12px;border:1.5px solid #E2E8F0;border-radius:10px;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;font-size:13px;font-weight:600;color:#374151;" onmouseover="this.style.background='#F8FAFC'" onmouseout="this.style.background='#fff'">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18" height="18">
      Google 계정으로 로그인
    </button>
    <div id="shell-err" style="margin-top:12px;font-size:11.5px;color:#EF4444;min-height:16px;"></div>
    <div style="margin-top:16px;font-size:11px;color:#94A3B8;">카페24 계정(@in.cd24.kr)으로 로그인 해주세요.</div>
  </div>
</div>

<script>
const PAGE_TITLES={'index':'대시보드','trend':'솔루션 동향','compare':'기능 전체 비교표','search':'기능 검색','edit':'등록·수정','assignee':'나의 현황','admin':'관리자 메뉴'};
let _currentUser = null;

function setActive(page) {
  document.querySelectorAll('.sb-item').forEach(el=>el.classList.toggle('active', el.dataset.page===page));
  const t=document.getElementById('shell-title');
  if(t) t.textContent=PAGE_TITLES[page]||'';
}

function navTo(page) {
  const frame=document.getElementById('main-frame');
  const fileMap={index:'dashboard',trend:'trend',compare:'compare',search:'search',edit:'edit',assignee:'assignee',admin:'admin'};
  if(frame) frame.src=(fileMap[page]||page)+'.html';
  setActive(page);
}

function navToSearch(q) {
  localStorage.setItem('_srchQ', q);
  navTo('search');
}

window.onFrameLogin = function(user) {
  _currentUser = user;
  const un=document.getElementById('sb-username'); if(un) un.textContent=user.name;
  const ur=document.getElementById('sb-userrole'); if(ur) ur.textContent=user.role==='admin'?'관리자':'담당자';
  const am=document.getElementById('admin-menu-item');
  if(am){ am.style.opacity=user.role==='admin'?'1':'0'; am.style.pointerEvents=user.role==='admin'?'auto':'none'; }
  const el=document.querySelectorAll('.edit-only');
  el.forEach(e=>{ e.style.display = (user.role==='admin'||user.role==='editor')?'':'none'; });
};

window.onFrameLogout = function() {
  _currentUser = null;
  document.getElementById('shell-login').style.display='flex';
  const frame=document.getElementById('main-frame');
  if(frame) frame.src='index.html';
};

function frameLogout() {
  const frame=document.getElementById('main-frame');
  if(frame && frame.contentWindow && frame.contentWindow.doLogout) {
    frame.contentWindow.doLogout();
  }
}

// Firebase (shell 자체 로그인)

  firebase.initializeApp({
    apiKey:"AIzaSyClykJM1ySRaboArlRaLiEQyvVjYAepS_Q",
    authDomain:"cafe24-sol-compare.firebaseapp.com",
    projectId:"cafe24-sol-compare",
    storageBucket:"cafe24-sol-compare.firebasestorage.app",
    messagingSenderId:"742500493763",
    appId:"1:742500493763:web:2456a2827f0c148f9eb576"
  });

const _sauth=firebase.auth();
const _sprov=new firebase.auth.GoogleAuthProvider();
_sprov.setCustomParameters({hd:'in.cd24.kr'});

document.getElementById('shell-login-btn').addEventListener('click',function(){
  _sauth.signInWithPopup(_sprov).then(r=>{
    const email=r.user.email;
    if(!email.endsWith('@in.cd24.kr')){_sauth.signOut();document.getElementById('shell-err').textContent='@in.cd24.kr 계정만 가능합니다.';return;}
    document.getElementById('shell-login').style.display='none';
    localStorage.setItem('_fb_user',JSON.stringify({email,name:r.user.displayName||email}));
  }).catch(err=>{document.getElementById('shell-err').textContent='오류: '+err.code;});
});

// 로드 즉시 캐시 확인 → 없으면 바로 로그인 화면 표시 (깜빡임 방지)
if(!localStorage.getItem('_fb_user')) {
  document.getElementById('shell-login').style.display='flex';
}

_sauth.onAuthStateChanged(user=>{
  if(user&&user.email.endsWith('@in.cd24.kr')){
    document.getElementById('shell-login').style.display='none';
    localStorage.setItem('_fb_user',JSON.stringify({email:user.email,name:user.displayName||user.email}));
  } else if(user) {
    _sauth.signOut();
    localStorage.removeItem('_fb_user');
  } else {
    if(!localStorage.getItem('_fb_user')) {
      document.getElementById('shell-login').style.display='flex';
    }
  }
});
</script>
</body>
</html>
