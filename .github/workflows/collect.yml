name: 솔루션 동향 자동 수집

on:
  schedule:
    - cron: '0 23 * * *'  # 매일 KST 08:00 (UTC 23:00 전날)
  workflow_dispatch:        # 수동 실행 버튼

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: |
          pip install requests beautifulsoup4 feedparser openai lxml

      - name: 동향 수집 실행
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/collect.py

      - name: 결과 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/trends.json
          git diff --staged --quiet || git commit -m "동향 자동 수집 $(date '+%Y-%m-%d %H:%M')"
          git push
